version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: fileshare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fileshare}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-45432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fileshare_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fileshare_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-fileshare}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fileshare_network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: fileshare_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-40080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fileshare_network

  # Redis (Optional - for cache and queues)
  redis:
    image: redis:7-alpine
    container_name: fileshare_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-46379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fileshare_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Queue Worker (Optional)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fileshare_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-fileshare}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - REDIS_HOST=redis
    depends_on:
      - app
      - redis
    networks:
      - fileshare_network

networks:
  fileshare_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
